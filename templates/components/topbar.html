<header class="sticky top-0 z-40 bg-white border-b border-gray-200 no-print">
    <div class="flex items-center justify-between px-4 sm:px-6 h-16">
        <div class="flex items-center gap-4 min-w-0">
            <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden text-gray-500 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h1 class="text-lg sm:text-xl font-semibold text-gray-900 truncate">{{ page_title|default:"Dashboard" }}</h1>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            {% if demo_env.mock_ai %}
            <span class="hidden sm:inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-800 border border-amber-200">Mock AI</span>
            {% endif %}
            {% if demo_env.integrations_mock %}
            <span class="hidden md:inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-800 border border-amber-200">Mock Meta</span>
            {% endif %}
            <span class="inline-flex items-center gap-1.5 rounded-full bg-green-50 px-2.5 py-1 text-xs font-medium text-green-700 border border-green-200">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                Local
            </span>
            <a href="{% url 'uat:feedback-create' %}?module={{ active_nav|default:'general' }}&url={{ request.path }}"
               class="hidden sm:inline-flex items-center rounded-lg border border-gray-300 px-2.5 py-1 text-xs font-medium text-gray-700 hover:bg-gray-50">
                Report Feedback
            </a>
        </div>
    </div>
</header>
